services:
  - type: web
    name: school-management
    env: python
    plan: free
    branch: main
    autoDeploy: true
    buildCommand: pip install -r requirements.txt && python create_admin_on_deploy.py
    startCommand: gunicorn -w 2 -b 0.0.0.0:$PORT app:app
    pythonVersion: 3.11
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: FLASK_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: MAIL_SERVER
        value: smtp.gmail.com
      - key: MAIL_PORT
        value: "587"
      - key: MAIL_USE_TLS
        value: "True"
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: school-management-postgres
          property: connectionString

databases:
  - name: school-management-postgres
    plan: free
    postgresMajorVersion: 15
